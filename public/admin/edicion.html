<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edición de Recurso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="bg-white border-b">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../index.html" class="text-xl font-semibold">Repositorio Digital</a>
            <div class="flex gap-4">
                <a href="ingestion.html" class="text-sm text-indigo-600 hover:text-indigo-900">Nuevo Recurso</a>
                <button id="logout" class="text-sm text-gray-600 hover:text-gray-900">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-semibold mb-6">Editar Recurso</h1>
        <form id="edicion-form" class="bg-white border rounded-lg p-6 space-y-4" enctype="multipart/form-data">
            <input type="hidden" id="recurso_id" name="id">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1" for="titulo">Título</label>
                    <input id="titulo" name="titulo" type="text" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="codigo_documento">Código (DOI/ISBN)</label>
                    <input id="codigo_documento" name="codigo_documento" type="text"
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="anio">Año de publicación</label>
                    <input id="anio" name="año_publicacion" type="number" min="1900" max="2100" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="coleccion">Colección</label>
                    <input id="coleccion" name="coleccion" type="text" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" for="resumen">Resumen</label>
                <textarea id="resumen" name="resumen" rows="5"
                    class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1" for="autores">Autores (separados por ;)</label>
                    <input id="autores" name="autores" type="text" placeholder="Apellido, Nombre; Otro Autor" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="etiquetas">Etiquetas (separadas por ,)</label>
                    <input id="etiquetas" name="etiquetas" type="text" placeholder="ética, IA, educación"
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1" for="tipo_documento">Tipo de documento</label>
                    <select id="tipo_documento" name="tipo_documento" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="ARTICULO">Artículo</option>
                        <option value="TESIS">Tesis</option>
                        <option value="LIBRO">Libro</option>
                        <option value="INFORME">Informe</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="estado_alojamiento">Origen</label>
                    <select id="estado_alojamiento" name="estado_alojamiento" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="ALOJADO">Alojado</option>
                        <option value="ORIGINAL">Original</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="licencia_cc">Licencia CC</label>
                    <select id="licencia_cc" name="licencia_cc" required
                        class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="CC BY 4.0">CC BY 4.0</option>
                        <option value="CC BY-SA 4.0">CC BY-SA 4.0</option>
                        <option value="CC BY-ND 4.0">CC BY-ND 4.0</option>
                        <option value="CC BY-NC 4.0">CC BY-NC 4.0</option>
                        <option value="CC BY-NC-SA 4.0">CC BY-NC-SA 4.0</option>
                        <option value="CC BY-NC-ND 4.0">CC BY-NC-ND 4.0</option>
                        <option value="CC0 1.0">CC0 1.0</option>
                    </select>
                </div>
            </div>

            <div id="group-alojado" class="hidden">
                <label class="block text-sm font-medium mb-1" for="archivo">Reemplazar Archivo (PDF/DOCX, máx 10
                    MB)</label>
                <input id="archivo" name="archivo" type="file" accept=".pdf,.doc,.docx" class="w-full text-sm">
                <p class="text-xs text-gray-500 mt-1">Dejar vacío para mantener el archivo actual.</p>
            </div>

            <div id="group-original" class="hidden">
                <label class="block text-sm font-medium mb-1" for="url_descarga">URL externa</label>
                <input id="url_descarga" name="url_descarga" type="url"
                    class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div class="flex items-center gap-3">
                <button type="submit"
                    class="inline-flex items-center justify-center px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md">Guardar
                    Cambios</button>
                <a href="../index.html" class="text-sm text-gray-600 hover:text-gray-900">Cancelar</a>
                <span id="edicion-status" class="text-sm"></span>
            </div>
        </form>
    </main>

    <script src="../js/admin.js"></script>
    <script>
        async function initSupabase() {
            try {
                const res = await fetch('/api/config')
                if (!res.ok) throw new Error('Failed to load config')
                const config = await res.json()
                window.SUPABASE_URL = config.SUPABASE_URL
                window.SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY
                window.supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
                return true
            } catch (e) {
                console.error('Error initializing Supabase:', e)
                return false
            }
        }

        initSupabase().then(ok => {
            if (ok && window.initAdmin) {
                window.initAdmin()
            }
        })
    </script>
</body>

</html>
