<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="min-h-screen bg-gray-50 text-gray-900 grid place-items-center p-4">
  <div class="w-full max-w-md bg-white border rounded-lg p-6">
    <h1 class="text-xl font-semibold mb-6 text-center">Acceso de Administración</h1>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required
          class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
          class="w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
      </div>
      <button type="submit"
        class="w-full inline-flex items-center justify-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Ingresar</button>
      <p id="login-error" class="text-sm text-red-600 mt-2 hidden"></p>
    </form>
  </div>

  <script src="../js/admin.js"></script>
  <script>
    async function initSupabase() {
      try {
        const res = await fetch('/api/config')
        if (!res.ok) throw new Error('Failed to load config')
        const config = await res.json()
        window.SUPABASE_URL = config.SUPABASE_URL
        window.SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY
        window.supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
        return true
      } catch (e) {
        console.error('Error initializing Supabase:', e)
        return false
      }
    }

    initSupabase().then(ok => {
      if (ok && window.initAdmin) {
        window.initAdmin()
      }
    })
  </script>
</body>

</html>
