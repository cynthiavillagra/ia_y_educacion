<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="min-h-screen bg-gray-50 text-gray-900 font-sans grid place-items-center p-4">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-indigo-600 tracking-tight">Repositorio Digital</h1>
      <p class="text-gray-500 mt-2 text-sm">Acceso al panel de administración</p>
    </div>

    <form id="login-form" class="space-y-6">
      <div class="space-y-1">
        <label class="block text-sm font-semibold text-gray-700" for="email">Email</label>
        <input id="email" name="email" type="email" required
          class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors px-4 py-2">
      </div>
      <div class="space-y-1">
        <label class="block text-sm font-semibold text-gray-700" for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
          class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors px-4 py-2">
      </div>

      <button type="submit"
        class="w-full inline-flex items-center justify-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Ingresar
      </button>

      <div id="login-error"
        class="p-3 bg-red-50 text-red-700 text-sm rounded-lg hidden border border-red-100 text-center"></div>
    </form>
  </div>

  <script src="../js/admin.js"></script>
  <script>
    async function initSupabase() {
      try {
        const res = await fetch('/api/config')
        if (!res.ok) throw new Error('Failed to load config')
        const config = await res.json()
        window.SUPABASE_URL = config.SUPABASE_URL
        window.SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY
        window.supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
        return true
      } catch (e) {
        console.error('Error initializing Supabase:', e)
        return false
      }
    }

    initSupabase().then(ok => {
      if (ok && window.initAdmin) {
        window.initAdmin()
      }
    })
  </script>
</body>

</html>
