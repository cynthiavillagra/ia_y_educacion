<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingestión de Recursos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/autocomplete.css">
</head>

<body class="min-h-screen bg-gray-50 text-gray-900 font-sans">
  <header class="bg-white border-b shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="../index.html" class="text-xl font-bold text-indigo-600 tracking-tight">Repositorio Digital</a>
      <nav class="flex items-center gap-6">
        <a href="../index.html" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Buscar
          / Inicio</a>
        <a href="ingestion.html" class="text-sm font-medium text-indigo-600 transition-colors">Nuevo Recurso</a>
        <button id="logout" class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">Cerrar
          sesión</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Ingestión de Recurso</h1>
      <p class="text-gray-500 mt-2">Complete el formulario para añadir un nuevo recurso al repositorio.</p>
    </div>

    <form id="ingestion-form" class="bg-white border border-gray-200 rounded-xl shadow-sm p-8 space-y-6"
      enctype="multipart/form-data">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="titulo">Título</label>
          <input id="titulo" name="titulo" type="text" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="titulo_original">Título Original
            (opcional)</label>
          <input id="titulo_original" name="titulo_original" type="text"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="doi">DOI</label>
          <input id="doi" name="doi" type="text" placeholder="10.xxxx/..."
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="isbn_issn">ISBN / ISSN</label>
          <input id="isbn_issn" name="isbn_issn" type="text"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="anio">Año de publicación</label>
          <input id="anio" name="anio_publicacion" type="number" min="1900" max="2100"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="institucion_fuente">Institución Fuente</label>
          <input id="institucion_fuente" name="institucion_fuente" type="text" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="institucion_autora">Institución Autora</label>
          <input id="institucion_autora" name="institucion_autora" type="text"
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-sm font-semibold text-gray-700" for="resumen">Descripción / Resumen</label>
        <textarea id="resumen" name="descripcion_resumen" rows="4"
          class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="autores">Autores</label>
          <div class="autocomplete-container">
            <input id="autores" name="autores" type="text" placeholder="Apellido, Nombre; Otro Autor"
              class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
            <div id="autores-dropdown" class="autocomplete-dropdown"></div>
          </div>
          <p class="text-xs text-gray-500">Separados por punto y coma (;).</p>
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="etiquetas">Palabras Clave</label>
          <div class="autocomplete-container">
            <input id="etiquetas" name="palabras_clave" type="text" placeholder="ética, IA, educación"
              class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
            <div id="etiquetas-dropdown" class="autocomplete-dropdown"></div>
          </div>
          <p class="text-xs text-gray-500">Separadas por coma (,).</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="tipo_recurso">Tipo de Recurso</label>
          <select id="tipo_recurso" name="tipo_recurso" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
            <option value="paper_academico">Paper Académico</option>
            <option value="libro">Libro</option>
            <option value="capitulo_libro">Capítulo de Libro</option>
            <option value="informe">Informe</option>
            <option value="guia">Guía</option>
            <option value="normativa">Normativa</option>
            <option value="diseno_curricular">Diseño Curricular</option>
            <option value="articulo_web">Artículo Web</option>
            <option value="web_institucional">Web Institucional</option>
            <option value="material_docente">Material Docente</option>
            <option value="boletin">Boletín</option>
            <option value="dataset">Dataset</option>
            <option value="presentacion">Presentación</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="archivo_local">¿Alojamiento Local?</label>
          <select id="archivo_local" name="archivo_local" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
            <option value="false">No (Solo Link Externo)</option>
            <option value="true">Sí (Subir Archivo)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700" for="licencia">Licencia</label>
          <select id="licencia" name="licencia" required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
            <option value="CC BY 4.0">CC BY 4.0</option>
            <option value="CC BY-SA 4.0">CC BY-SA 4.0</option>
            <option value="CC BY-ND 4.0">CC BY-ND 4.0</option>
            <option value="CC BY-NC 4.0">CC BY-NC 4.0</option>
            <option value="CC BY-NC-SA 4.0">CC BY-NC-SA 4.0</option>
            <option value="CC BY-NC-ND 4.0">CC BY-NC-ND 4.0</option>
            <option value="CC0 1.0">CC0 1.0</option>
            <option value="Copyright">Copyright</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
      </div>

      <div id="group-local" class="hidden p-4 bg-gray-50 rounded-lg border border-gray-200">
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="archivo">Archivo PDF/DOCX</label>
        <input id="archivo" name="archivo" type="file" accept=".pdf,.doc,.docx"
          class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        <p class="text-xs text-gray-500 mt-2">Se alojará en Supabase Storage.</p>
      </div>

      <div id="group-url">
        <label class="block text-sm font-semibold text-gray-700 mb-1" for="url_fuente_original">URL Fuente
          Original</label>
        <input id="url_fuente_original" name="url_fuente_original" type="url" placeholder="https://..."
          class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 transition-colors">
      </div>

      <div class="pt-4 flex items-center gap-4 border-t border-gray-100">
        <button type="submit"
          class="inline-flex items-center justify-center px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-all focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Guardar Recurso
        </button>
        <span id="ingestion-status" class="text-sm font-medium ml-auto"></span>
      </div>
    </form>
  </main>

  <script src="../js/autocomplete.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    async function initSupabase() {
      try {
        const res = await fetch('/api/config')
        if (!res.ok) throw new Error('Failed to load config')
        const config = await res.json()
        window.SUPABASE_URL = config.SUPABASE_URL
        window.SUPABASE_ANON_KEY = config.SUPABASE_ANON_KEY
        window.supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
        return true
      } catch (e) {
        console.error('Error initializing Supabase:', e)
        return false
      }
    }

    initSupabase().then(ok => {
      if (ok && window.initAdmin) {
        window.initAdmin()
      }
    })
  </script>
</body>

</html>
