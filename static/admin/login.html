<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión | Repositorio IA y Educación</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
      <a href="../index.html" class="logo">
        <div class="logo-icon">R</div>
        <span>IA y Educación</span>
      </a>
      <nav>
        <a href="../index.html" class="nav-link">← Volver al Catálogo</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:var(--space-8);">
    <div style="width:100%; max-width:400px;">

      <div class="detail-card">
        <div class="detail-header" style="text-align:center; padding:var(--space-6);">
          <h1 style="font-size:1.5rem; color:white; margin:0;">🔐 Área de Administración</h1>
        </div>

        <div class="detail-body">
          <p style="text-align:center; color:var(--neutral-600); margin-bottom:var(--space-6);">
            Ingresa tus credenciales para acceder al panel de gestión de recursos.
          </p>

          <form id="login-form" style="display:flex; flex-direction:column; gap:var(--space-5);">
            <div class="form-group">
              <label class="form-label" for="email">Correo electrónico</label>
              <input id="email" name="email" type="email" required class="form-input" placeholder="admin@ejemplo.com"
                autocomplete="email">
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Contraseña</label>
              <input id="password" name="password" type="password" required class="form-input" placeholder="••••••••"
                autocomplete="current-password">
            </div>

            <div id="login-error" class="hidden"
              style="background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:var(--space-3); border-radius:var(--border-radius); font-size:0.875rem; text-align:center;">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
              Iniciar Sesión
            </button>
          </form>

          <p style="text-align:center; margin-top:var(--space-6); font-size:0.8rem; color:var(--neutral-500);">
            ¿Problemas para acceder? Contacta al administrador del sistema.
          </p>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <div>
        <strong>Repositorio Digital</strong> • Panel de Administración
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    async function initLogin() {
      // Cargar config de Supabase
      try {
        const res = await fetch('/api/config')
        if (!res.ok) throw new Error('Config no disponible')
        const config = await res.json()
        window.supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
      } catch (e) {
        console.error('Error init Supabase:', e)
        document.getElementById('login-error').textContent = 'Error de conexión con el servidor'
        document.getElementById('login-error').classList.remove('hidden')
        return
      }

      // Form submit
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        const errorEl = document.getElementById('login-error')

        errorEl.classList.add('hidden')

        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password })

          if (error) {
            errorEl.textContent = 'Credenciales inválidas'
            errorEl.classList.remove('hidden')
            return
          }

          localStorage.setItem('sb_access_token', data.session?.access_token)
          location.href = '/admin/ingestion.html'
        } catch (err) {
          errorEl.textContent = 'Error de autenticación'
          errorEl.classList.remove('hidden')
        }
      })
    }

    initLogin()
  </script>
</body>

</html>
